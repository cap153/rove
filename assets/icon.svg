<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256">
  <defs>
    <!-- 圆角徽章底座：深海夜蓝 -->
    <linearGradient id="tile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1E4D"/>
      <stop offset="100%" stop-color="#030B22"/>
    </linearGradient>

    <!-- 文件夹后背夹层 -->
    <linearGradient id="grad-back-tab" gradientUnits="userSpaceOnUse" x1="230" y1="130" x2="432" y2="130">
      <stop offset="0%" stop-color="#05396B"/>
      <stop offset="100%" stop-color="#0C6F8E"/>
    </linearGradient>

    <!-- 文件夹主体：电光青 -> 皇家蓝 -->
    <linearGradient id="grad-folder-base" gradientUnits="userSpaceOnUse" x1="120" y1="56" x2="360" y2="442">
      <stop offset="0%" stop-color="#14F1FF"/>
      <stop offset="45%" stop-color="#00C6EE"/>
      <stop offset="80%" stop-color="#0072EE"/>
      <stop offset="100%" stop-color="#0038A8"/>
    </linearGradient>

    <!-- 文件夹右上薄荷高光 -->
    <radialGradient id="grad-folder-mint" gradientUnits="userSpaceOnUse" cx="455" cy="155" r="265">
      <stop offset="0%" stop-color="#66FFBA" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#34F0C2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00C6EE" stop-opacity="0"/>
    </radialGradient>

    <!-- 左下斜切穿插流线带（保留冷色调呼应文件夹） -->
    <linearGradient id="grad-wedge" gradientUnits="userSpaceOnUse" x1="60" y1="440" x2="330" y2="265">
      <stop offset="0%" stop-color="#7CFFE0"/>
      <stop offset="35%" stop-color="#14D8E8"/>
      <stop offset="72%" stop-color="#0088CE"/>
      <stop offset="100%" stop-color="#00367A"/>
    </linearGradient>

    <!-- Rust 铁锈橙极速箭头撞色 -->
    <linearGradient id="grad-rust-chevron" gradientUnits="userSpaceOnUse" x1="240" y1="195" x2="390" y2="375">
      <stop offset="0%" stop-color="#FFB258"/>
      <stop offset="48%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Rust 铁锈橙左侧极速流线 -->
    <linearGradient id="grad-rust-pill-1" gradientUnits="userSpaceOnUse" x1="20" y1="258" x2="226" y2="258">
      <stop offset="0%" stop-color="#FFC069"/>
      <stop offset="55%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="grad-rust-pill-2" gradientUnits="userSpaceOnUse" x1="54" y1="313" x2="164" y2="313">
      <stop offset="0%" stop-color="#FFB35C"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- 投影模糊滤镜 -->
    <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- 路径复用 -->
    <path id="folder-path"
          d="M 64 90
             A 34 34 0 0 1 98 56
             L 216 56
             C 234 56 244 65.5 252 76
             L 284 118
             C 292 128.5 300 134 316 134
             L 448 134
             C 478 134 488 162 483 184
             L 436 396
             C 431 418 405 442 372 442
             L 100 442
             C 140 434 195 402 268 355
             L 360 278
             L 280 206
             L 182 200
             C 138 201 98 208 64 218 Z"/>

    <path id="wedge-path"
          d="M 56 442
             Q 188 345 322 250
             L 352 286
             L 250 380
             C 182 422 118 442 56 442 Z"/>

    <path id="chevron-path"
          d="M 182 198
             C 228 196.5 275 196 322 196
             C 350 196 366 204 384 222
             L 438 284
             L 378 348
             C 360 368 344 378 316 378
             L 238 378
             L 334 284
             C 295 236 248 202 182 198 Z"/>

    <!-- 将箭头阴影裁剪在文件夹与斜切带内部，绝不溢出到镂空区 -->
    <clipPath id="shadow-clip">
      <use href="#folder-path"/>
      <use href="#wedge-path"/>
    </clipPath>
  </defs>

  <!-- 底座 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile-bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 主体居中缩放 -->
  <g transform="translate(256, 256) scale(0.79) translate(-252, -249)">
    <path d="M 230 96 L 406 96 A 26 26 0 0 1 432 122 L 432 165 L 230 165 Z" fill="url(#grad-back-tab)"/>
    <use href="#folder-path" fill="url(#grad-folder-base)"/>
    <use href="#folder-path" fill="url(#grad-folder-mint)"/>
    <use href="#wedge-path" fill="url(#grad-wedge)"/>

    <!-- 仅落在文件夹上的干净阴影 -->
    <g clip-path="url(#shadow-clip)">
      <use href="#chevron-path" transform="translate(-5, 9)" fill="#001238" opacity="0.52" filter="url(#blur-shadow)"/>
    </g>

    <!-- Rust 铁锈橙箭头与流线 -->
    <use href="#chevron-path" fill="url(#grad-rust-chevron)"/>
    <rect x="20" y="238" width="206" height="40" rx="20" fill="url(#grad-rust-pill-1)"/>
    <rect x="54" y="294" width="110" height="38" rx="19" fill="url(#grad-rust-pill-2)"/>
  </g>
</svg>
