[package]
name = "rove"
version = "0.1.0"
edition = "2021"
description = "Rove — 极速响应、极低内存的 Windows 文件管理器 (Rust + Slint)"

[dependencies]
slint = { version = "1.11", default-features = false, features = [
    # 标准库支持（TextEdit / ScrollView 等内建控件需要）。
    "std",
    # GPU 渲染（femtovg/OpenGL）；软件渲染作为后端备选，
    # 运行时用 SLINT_BACKEND=winit-software 切换。
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    # 暴露 raw-window-handle，供 Win32 辅助（前景窗口/显示器查询）使用。
    "raw-window-handle-06",
    # 暴露 slint::winit_030::{WinitWindowAccessor, winit}，供窗口事件钩子
    # （应用级快捷键、原生消息拦截）使用。
    "unstable-winit-030",
    # Slint 1.18 的前向兼容特性（官方要求显式启用）。
    "compat-1-18",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = "5"
open = "5"
raw-window-handle = "0.6"
toml_edit = "0.22"
nucleo-matcher = "0.3"
pinyin = { version = "0.10", features = ["plain", "heteronym"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
# 任务 3.2：NTFS 全盘索引加速。通过卷句柄 FSCTL_ENUM_USN_DATA 枚举 MFT 记录
# 并重构路径（直接 open \\.\X:\$MFT 会被内核独占锁死，任何权限均 Access Denied）。
# 注意：该 crate 依赖 `windows` 且无平台门控，只能在 Windows 目标下引入，
# 否则 Linux 宿主构建/测试会失败。
usn-journal-rs = "0.4.1"
windows = { version = "0.59", features = [
    "Win32_UI_Shell",
    # IFileDialog / COMDLG_FILTERSPEC（原生文件选择对话框）。
    "Win32_UI_Shell_Common",
    # 拖出：Ole 拖放（DoDragDrop/IDropSource）、格式注册、全局内存。
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# 拖出自定义 IDropSource 需要 implement 宏（windows-core 内置导出）。
windows-core = { version = "0.59" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Registry",
    # GetLocalTime：诊断日志本地时间戳。
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
] }

[build-dependencies]
slint-build = "1.11"
# 写入 exe 图标与版本信息（见 build.rs）。
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
