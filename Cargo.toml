[package]
name = "rove"
version = "0.1.0"
edition = "2024"
description = "Rove - 高性能轻量级 Windows 文件管理器"

[[bin]]
name = "rove"
path = "src/main.rs"

[dependencies]
slint = "1.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.25"
dirs = "6"
pinyin = { version = "0.11", features = ["heteronym"] }
nucleo-matcher = "0.3"
similar = "3.2"
calamine = "0.36"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
