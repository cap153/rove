[package]
name = "rove"
version = "0.1.2"
edition = "2021"
description = "Rove — 极速响应、极低内存的 Windows 文件管理器 (Rust + Slint)"

[dependencies]
slint = { version = "1.11", default-features = false, features = [
    # 标准库支持（TextEdit / ScrollView 等内建控件需要）。
    "std",
    # GPU 渲染（femtovg/OpenGL）；软件渲染作为后端备选，
    # 运行时用 SLINT_BACKEND=winit-software 切换。
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    # 暴露 raw-window-handle，供 Win32 辅助（前景窗口/显示器查询）使用。
    "raw-window-handle-06",
    # 暴露 slint::winit_030::{WinitWindowAccessor, winit}，供窗口事件钩子
    # （应用级快捷键、原生消息拦截）使用。
    "unstable-winit-030",
    # Slint 1.18 的前向兼容特性（官方要求显式启用）。
    "compat-1-18",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
globset = "0.4"
# 批量重命名的正则引擎（字面模式也走它，保证两种模式的命中/高亮完全一致）。
regex = "1"
trash = "5"
open = "5"
raw-window-handle = "0.6"
toml_edit = "0.22"
nucleo-matcher = "0.3"
pinyin = { version = "0.10", features = ["plain", "heteronym"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
# 任务 3.2：NTFS 全盘索引加速。通过卷句柄 FSCTL_ENUM_USN_DATA 枚举 MFT 记录
# 并重构路径（直接 open \\.\X:\$MFT 会被内核独占锁死，任何权限均 Access Denied）。
# 注意：该 crate 依赖 `windows` 且无平台门控，只能在 Windows 目标下引入，
# 否则 Linux 宿主构建/测试会失败。
usn-journal-rs = "0.4.1"
windows = { version = "0.59", features = [
    "Win32_UI_Shell",
    # IShellView（登记成 Shell 窗口时实现 SelectItem）需要 Controls 里的
    # LPFNSVADDPROPSHEETPAGE 类型门控。
    "Win32_UI_Controls",
    # IFileDialog / COMDLG_FILTERSPEC（原生文件选择对话框）。
    "Win32_UI_Shell_Common",
    # 右键菜单：GetKeyState（Shift/Ctrl 修饰键）。
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    # 拖出：Ole 拖放（DoDragDrop/IDropSource）、格式注册、全局内存。
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    # LoadLibrary / GetProcAddress 之外还有 MsgWaitForMultipleObjectsEx 与
    # CreateEventW：登记成 Shell 窗口的线程要泵消息，Shell 才能把
    # IShellView::SelectItem 调进来。
    "Win32_System_Threading",
    # CreateEventW 需要 SECURITY_ATTRIBUTES。
    "Win32_Security",
    # GetModuleHandleW：Win+E 的低级键盘钩子要拿模块句柄。
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    # DEFCONTEXTMENU 结构体在 windows crate 里受此 feature 门控（原生右键菜单用）。
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    # WIC（Windows Imaging Component）：缩略图磁盘缓存用 JPEG q90 / PNG 编解码。
    "Win32_Graphics_Imaging",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # NetApiBufferFree：枚举服务器共享（NetShareEnum）后释放缓冲。
    "Win32_NetworkManagement_NetManagement",
    "Win32_UI_WindowsAndMessaging",
] }
# 拖出自定义 IDropSource 需要 implement 宏（windows-core 内置导出）。
windows-core = { version = "0.59" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    # GetDpiForWindow：无边框命中测试按当前显示器的缩放换算坐标。
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Registry",
    # ReadProcessMemory：安全读取 WM_SETTINGCHANGE 广播进来的字符串指针
    # （跨进程指针在我们地址空间里未必可读，直接解引用会崩）。
    "Win32_System_Diagnostics_Debug",
    # GetLocalTime：诊断日志本地时间戳。
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
    # K32GetProcessMemoryInfo：`[mem]` 诊断日志打印进程自身工作集 / 私有字节。
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }

[build-dependencies]
slint-build = "1.11"
# 写入 exe 图标与版本信息（见 build.rs）。
winresource = "0.1"

# 日常开发用的 debug 构建：不生成 DWARF 调试信息。
#
# 之前 debug/rove.exe 有 421 MB、target/debug 目录 29 GB —— 全是调试信息。
# Rove 排查问题靠的是 rove.log 与日志级别开关，panic 里记的 `文件:行:列`
# 来自编译期元数据（`PanicInfo::location()`），不依赖 DWARF；运行时性能
# 也与调试信息无关。所以关掉它只是缩小产物，不影响排查和速度。
# 需要单步调试时临时改成 `debug = 2` 即可。
[profile.dev]
debug = 0
# 符号表也不要：debug exe 里它占 35 MB（103 → 68 MB）。
# Windows GUI exe 不靠符号表运行，panic 的 `文件:行:列` 也不受影响。
strip = "symbols"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
